name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The unit tests use only Node's built-in test runner; no install needed
      - name: Unit tests
        run: npm test
      - name: Result engine copy in functions matches js/core-engine
        run: |
          node scripts/copy-core-engine.js
          git diff --exit-code -- functions/src/core-engine
      - name: Lint Cloud Functions
        run: |
          npm --prefix functions ci
          npm --prefix functions run lint
      - name: Translation keys
        run: |
          node scripts/audit_i18n.cjs | tee i18n.txt
          grep -q "All i18n keys" i18n.txt
      - name: Service worker cache list is up to date
        run: npm run check:sw-cache

  # The security rules, as deploy checks them: a broken rule is caught on push,
  # not first when deploying
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm ci
          npm install -g firebase-tools
      - name: Firestore rules
        run: npm run test:rules
      - name: Storage rules
        run: npm run test:storage-rules

  # The browser tests (Playwright) against the emulators, as test:smoke runs
  # them locally: auth, Firestore, Functions and Storage in a demo project
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Traces, videos and screenshots of failed tests (uploaded below)
      PLAYWRIGHT_OUTPUT_DIR: ${{ github.workspace }}/playwright-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The emulator downloads (jar files with the version in the name)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1
      - name: Install
        run: |
          npm ci
          npm --prefix functions ci
          npm install -g firebase-tools
          npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:smoke
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            playwright-output/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # A competition exported, deleted and restored in the Firestore emulator
  # (scripts/restore-competition.mjs), and the personal data retention run
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1
      # The restore script and test use firebase-admin from functions/
      - name: Install
        run: |
          npm ci
          npm --prefix functions ci
          npm install -g firebase-tools
      - name: Backup restore and retention tests
        run: npm run test:restore
