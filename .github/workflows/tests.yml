name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The unit tests use only Node's built-in test runner; no install needed
      - name: Unit tests
        run: npm test
      - name: Result engine copy in functions matches js/core-engine
        run: |
          node scripts/copy-core-engine.js
          git diff --exit-code -- functions/src/core-engine
      - name: Lint Cloud Functions
        run: |
          npm --prefix functions ci
          npm --prefix functions run lint
      - name: Translation keys
        run: |
          node scripts/audit_i18n.cjs | tee i18n.txt
          grep -q "All i18n keys" i18n.txt
      - name: Service worker cache list is up to date
        run: npm run check:sw-cache

  # The security rules, as deploy checks them: a broken rule is caught on push,
  # not first when deploying
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm ci
          npm install -g firebase-tools
      - name: Firestore rules
        run: npm run test:rules
      - name: Storage rules
        run: npm run test:storage-rules
