<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmälan Funktionär - Sportkörning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">

    <div class="max-w-2xl mx-auto py-10 px-4">
        <div class="text-center mb-10">
            <!-- Optional: Logo here -->
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Funktionärsanmälan</h1>
            <p class="text-gray-600">Vi behöver din hjälp! Fyll i formuläret nedan för att anmäla dig som funktionär.
            </p>
        </div>

        <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100">
            <form id="volunteerForm" class="space-y-6">

                <!-- Personuppgifter -->
                <div>
                    <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">Personuppgifter</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Namn *</label>
                            <input type="text" id="volName" required
                                class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Telefon *</label>
                            <input type="tel" id="volPhone" required
                                class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">E-post *</label>
                            <input type="email" id="volEmail" required
                                class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Klubb</label>
                            <input type="text" id="volClub"
                                class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tröjstorlek</label>
                            <select id="volShirtSize" class="w-full p-2 border rounded-md bg-white">
                                <option value="">- Välj -</option>
                                <option value="XS">XS</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="XXL">XXL</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Logistik & ICE -->
                <div>
                    <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">Logistik & Säkerhet</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Kost / Allergier</label>
                            <input type="text" id="volDiet" placeholder="T.ex. Vegetarian, Gluten..."
                                class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Namn Anhörig (ICE) *</label>
                            <input type="text" id="volIceName" required
                                class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tel Anhörig (ICE) *</label>
                            <input type="tel" id="volIcePhone" required
                                class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Önskemål -->
                <div>
                    <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">Uppdrag</h2>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Önskat område / Roll</label>
                        <select id="volRole" class="w-full p-2 border rounded-md bg-white mb-2">
                            <option value="">- Inget specifikt / Välj åt mig -</option>
                            <option value="Hinderpersonal">Hinderpersonal (Maraton)</option>
                            <option value="Sekretariat">Sekretariat</option>
                            <option value="Banpersonal">Banpersonal (Dressyr/Precision)</option>
                            <option value="Catering">Catering / Service</option>
                            <option value="Sjukvård">Sjukvård</option>
                            <option value="Övrigt">Övrigt</option>
                        </select>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Notering / Kompetens</label>
                        <textarea id="volNotes" rows="3"
                            placeholder="T.ex. Kan köra traktor, har sjukvårdsutbildning, kan bara lördag..."
                            class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>
                </div>

                <div class="pt-4 border-t">
                    <button type="submit" id="btnSubmit"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors text-lg">
                        Skicka Anmälan
                    </button>
                    <p id="statusMsg" class="text-center mt-4 hidden font-medium"></p>
                </div>

            </form>
        </div>
    </div>

    <!-- Firebase Config & Logic (Module) -->
    <script type="module" src="./js/pages/volunteer-signup.js"></script>

</body>

</html>
